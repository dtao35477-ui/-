<!doctype html><html lang="zh-CN"><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动画与材质特效验收</title><link rel="stylesheet" href="../style.css"><style>body{padding:16px}h1{font-size:22px;margin-bottom:14px}.lab-controls{display:flex;flex-wrap:wrap;gap:7px;max-width:950px;margin:0 auto 18px}.lab-controls button{background:#34565a;padding:9px 12px;border-radius:8px}.lab{display:flex;gap:22px;max-width:950px;margin:auto;align-items:start}.lab .game-layout{width:420px;flex-shrink:0}.lab .adventure{width:100%}.lab .board-frame{margin:8px}.lab-info{max-width:300px;line-height:1.9;font-size:13px;color:#c0d7d0}.lab-info h2{color:#ffe2a0}#readout{font:12px monospace;white-space:pre-wrap;color:#94d6c9}@media(max-width:700px){body{padding:10px}.lab{display:block}.lab .game-layout{width:100%;max-width:420px}.lab-info{margin-top:20px}}</style>
<h1>动画与材质特效验收</h1><div class="lab-controls"><button id="all">五种材质齐发</button><button id="red">红药瓶</button><button id="blue">蓝贝壳</button><button id="gold">金星星</button><button id="green">绿宝石</button><button id="purple">紫药水</button><button id="cross">十字闪电</button><button id="blast">爆破</button><button id="auto">自动循环展示</button><button id="idle">担心与眨眼</button><button id="fear">惊恐喘气</button><button id="run">奔跑</button><button id="happy">开心挥手</button><button id="pause-lab">暂停动画</button></div>
<div class="lab"><div class="game-layout"><div class="adventure"><div id="scene" class="scene"><div id="world"></div><div id="speech" class="speech"></div></div></div><div class="board-frame"><div id="board"></div></div></div><aside class="lab-info"><h2>真实运行的游戏素材与特效</h2><p>玻璃药液、贝壳珍珠、金色星芒、宝石碎晶、紫色魔雾。素材碎片从各自的宝物图像中裁切，特殊宝物额外产生贯穿光束或爆破波。</p><p>本页只用于本地验收；主游戏使用相同的动画和特效代码。</p><div id="readout"></div></aside></div>
<script src="../engine.js"></script><script src="../art.js"></script><script src="../effects.js"></script><script>
const E=RescueEngine,config=E.level(7);let state=E.newRun(config),phase='playing',paused=false,auto=false,clock=0,last=performance.now(),next=0;const board=Array.from({length:49},(_,i)=>i%5);document.getElementById('world').innerHTML=RelicArt.scene(config);document.getElementById('board').innerHTML=board.map((v,i)=>'<button class="tile" data-index="'+i+'">'+RelicArt.gem(v)+'</button>').join('');RelicArt.reset();RelicFX.init();
function burst(indices,special){const before=[...board];if(special)before[24]=special;RelicFX.wave({before,cleared:indices,removedRocks:[],chippedRocks:[]},3);RelicArt.react('match');}
document.getElementById('all').onclick=()=>burst([14,15,16,17,18]);['red','blue','gold','green','purple'].forEach((id,c)=>document.getElementById(id).onclick=()=>burst([20+c]));document.getElementById('cross').onclick=()=>burst([24],5);document.getElementById('blast').onclick=()=>burst([24],10);document.getElementById('auto').onclick=()=>auto=!auto;document.getElementById('idle').onclick=()=>{state=E.newRun(config);phase='playing';};document.getElementById('fear').onclick=()=>{state.danger=.85;phase='playing';};document.getElementById('run').onclick=()=>{state=E.newRun(config);state.dug=[...config.rocks];phase='playing';RelicArt.reset();};document.getElementById('happy').onclick=()=>{state=E.newRun(config);phase='won';};document.getElementById('pause-lab').onclick=()=>paused=!paused;
function loop(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)clock+=dt;if(auto&&!paused&&clock>next){next=clock+.65;burst([14,15,16,17,18]);}RelicArt.update(config,state,phase,paused,dt);RelicFX.frame(dt,paused);document.getElementById('readout').textContent='人物帧 '+document.getElementById('world').dataset.motionFrame+' / 蛇表情 '+document.getElementById('serpent').dataset.expression+'\n活动特效 '+document.getElementById('match-effects').dataset.active;requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
